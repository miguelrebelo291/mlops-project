feature_store:
  # Hopsworks project name. Leave empty to use the default project of your
  # API key. The key comes from the HOPSWORKS_API_KEY environment variable.
  project: "mortgage_default"
  feature_group_name: mortgage_origination_features
  feature_group_version: 1
  description: "Origination features for default prediction (Freddie Mac 2005)"
  online_enabled: false
  # Hopsworks serverless (python engine) only accepts DELTA, which needs hops-deltalake.
  time_travel_format: "DELTA"
