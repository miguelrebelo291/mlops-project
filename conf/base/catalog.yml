# Here you can define all your data sets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html
#
# We support interacting with a variety of data stores including local file systems, cloud, network and HDFS
#
# An example data set definition can look as follows:
#
#bikes:
#  type: pandas.CSVDataset
#  filepath: "data/01_raw/bikes.csv"
#
#weather:
#  type: spark.SparkDataset
#  filepath: s3a://your_bucket/data/01_raw/weather*
#  file_format: csv
#  credentials: dev_s3
#  load_args:
#    header: True
#    inferSchema: True
#  save_args:
#    sep: '|'
#    header: True
#
#scooters:
#  type: pandas.SQLTableDataset
#  credentials: scooters_credentials
#  table_name: scooters
#  load_args:
#    index_col: ['name']
#    columns: ['name', 'gear']
#  save_args:
#    if_exists: 'replace'
#    # if_exists: 'fail'
#    # if_exists: 'append'
#
# The Data Catalog supports being able to reference the same file using two different Dataset implementations
# (transcoding), templating and a way to reuse arguments that are frequently repeated. See more here:
# https://docs.kedro.org/en/stable/data/data_catalog.html

raw_origination_data_2005:
  type: pandas.CSVDataset
  filepath: data/01_raw/sample_orig_2005.txt
  load_args:
    sep: "|"
    header: null
    low_memory: false

raw_performance_data_2005:
  type: pandas.CSVDataset
  filepath: data/01_raw/sample_svcg_2005.txt
  load_args:
    sep: "|"
    header: null
    low_memory: false

origination_data_named:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/origination_data_named.parquet

performance_data_named:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/performance_data_named.parquet

target_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/target_data.parquet

model_input_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/model_input_data.parquet

model_input_validated:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/model_input_validated.parquet

# Cleaned modeling dataset after data_cleaning pipeline (input da feature engineering)
origination_data_cleaned:
  type: pandas.ParquetDataset
  filepath: data/03_primary/model_input_cleaned.parquet

# Summary/statistics from the cleaning step
origination_cleaning_statistics:
  type: json.JSONDataset
  filepath: data/08_reporting/data_cleaning_statistics.json

# --- feature_engineering ---
features_train:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_train.parquet

features_test:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_test.parquet

feature_transformers:
  type: pickle.PickleDataset
  filepath: data/04_feature/feature_transformers.pkl

feature_engineering_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/feature_engineering_metrics.json

# --- feature_store (Hopsworks) ---
feature_store_metadata:
  type: json.JSONDataset
  filepath: data/08_reporting/feature_store_metadata.json

# --- feature_engineering_inference ---
# Input de inferência: empréstimos novos a prever (placeholder: usa os dados limpos)
origination_data_inference:
  type: pandas.ParquetDataset
  filepath: data/03_primary/model_input_cleaned.parquet

features_inference:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_inference.parquet
