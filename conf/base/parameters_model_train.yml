model_train:
  train_cutoff_year: 2002
  test_start_year: 2003
  target_column: default
  id_column: loan_sequence_number
  validation_size: 0.2
  random_state: 42
  threshold: 0.5
  selection_metric: val_f1
  threshold_strategy: maximize_f1
  beta: 1.0
  experiment_name: mortgage_default_model_search3
  run_name: holdout_random_search_tree_models
  registered_model_name: mortgage_default_classifier
  add_timestamp_to_run_name: true
  model_output_path: data/06_models/mlflow_model
  tracking_uri: sqlite:///mlflow.db
  n_iter: 5
  n_jobs: 3
  scoring: average_precision
  models:
    - logistic_regression
    - decision_tree
    - random_forest
    - extra_trees
    - gradient_boosting
    - hist_gradient_boosting